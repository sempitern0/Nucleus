<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Nucleus — stable core, composable systems</title>
  <desc>A central N surrounded by modular orbital nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="18" y1="14" x2="110" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171B2B"/>
      <stop offset="1" stop-color="#0B0E18"/>
    </linearGradient>
    <linearGradient id="core" x1="45" y1="43" x2="84" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C6CFF"/>
      <stop offset="1" stop-color="#31D6D0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="25" fill="url(#bg)" stroke="#2C3450" stroke-width="2"/>

  <g fill="none" stroke-linecap="round">
    <ellipse cx="64" cy="64" rx="45" ry="21" transform="rotate(-28 64 64)"
      stroke="#31D6D0" stroke-opacity=".52" stroke-width="2"/>
    <ellipse cx="64" cy="64" rx="45" ry="21" transform="rotate(32 64 64)"
      stroke="#7C6CFF" stroke-opacity=".52" stroke-width="2"/>
    <circle cx="64" cy="64" r="44" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="1"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="24" cy="48" r="5.5" fill="#31D6D0" stroke="#DFFFFD" stroke-width="1.5"/>
    <circle cx="96" cy="36" r="5.5" fill="#7C6CFF" stroke="#E7E3FF" stroke-width="1.5"/>
    <circle cx="103" cy="84" r="5.5" fill="#31D6D0" stroke="#DFFFFD" stroke-width="1.5"/>
    <circle cx="36" cy="96" r="5.5" fill="#7C6CFF" stroke="#E7E3FF" stroke-width="1.5"/>
  </g>

  <circle cx="64" cy="64" r="24" fill="#11182A" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="2"/>
  <circle cx="64" cy="64" r="19" fill="url(#core)" opacity=".96"/>

  <path d="M53 76V52L75 76V52" fill="none" stroke="#FFFFFF" stroke-width="5.5"
    stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="64" cy="64" r="28" fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="1"/>
</svg>
